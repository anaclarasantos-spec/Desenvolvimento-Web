!DOCTYPE html>
<html lang="pt-BR">
<html>

<nav>
</nav>
<main>
    <h2>Incrição</h2>
    <p>
        Preencha os dados abaixo para participar do evento
    </p>
    <form>
        <!--Campo nome-->
        <label for="nome"> Nome:</label>
        <input
        type="text"
        id="nome"
        name="nome"
        required>
        <!--campo email-->
        <label for="email">E-mail:</label>
        <input
        type="email"
        id="email"
        name="email"
        required>
        <!--campo idade-->
        <label for="idade">Idade:</label>
        <input
        type="number"
        id="idade"
        name="idade"
        required>
        <label for="experiencia">
            Nível de experiencia comprogramação
        </label>
        <select id="experiencia" name="experiencia">
            <option value="nenhuma">Nenhuma exeperiencia</option>
            <option value="iniciante">Iniciante</option>
            <option value="intermediario">Intermediario</option>
        </select>
    </form>
    <p>Qual aréa mais lhe interessa?</p>
    <input type="radio" id="web" name="area" value="web">
    <label for="web">Desenvolvimento Web</label>

    <input type="radio" id="dados" name="area" value="dados">
    <label for="dados">Ciência de dados</label>

    <input type="radio" id="infra" name="area" value="infra">
    <label for="infra">Infraestrutura</label>
    <input
    type="checkbox"
    id="novidades"
    name="novidades">
    <label for="novidades">
        quero receber informações sobre próximos eventos
    </label>
    <label for="observacoes">Observações:</label>
    <textarea
    id="observacoes"
    name="observacoes"
    rows="5"
    cols="40"></textarea>
    <button type="submit">
         realizar inscrição
    </button>
</main>
<footer>
    <hr>
    <p>Tech Experience 2026</p>
    <p>Projeto desenvolvido durante as aulas de Desenvolvimento Web.</p>
</footer>
</html>
